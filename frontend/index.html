<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DirCon</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("dircon.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#" aria-label="DirCon inicio">
        <span class="brand__mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="6.5" cy="5.5" r="2.5" fill="white"></circle>
            <path d="M1.5 14.5c0-2.761 2.239-5 5-5s5 2.239 5 5" stroke="white" stroke-width="1.5" stroke-linecap="round"></path>
            <circle cx="13" cy="7" r="2" fill="white" fill-opacity="0.7"></circle>
            <path d="M10.5 14.5c0-1.933 1.119-3.5 2.5-3.5s2.5 1.567 2.5 3.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"></path>
          </svg>
        </span>
        <span class="brand__name">Dir<span>Con</span></span>
      </a>

      <div class="topbar__actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
          <svg class="theme-toggle__icon theme-toggle__icon--moon" width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
            <path d="M14.5 10.2A6.1 6.1 0 016.8 2.5 6.3 6.3 0 1014.5 10.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
          </svg>
          <svg class="theme-toggle__icon theme-toggle__icon--sun" width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.5"></circle>
            <path d="M8.5 1.5v2M8.5 13.5v2M3.55 3.55l1.42 1.42M12.03 12.03l1.42 1.42M1.5 8.5h2M13.5 8.5h2M3.55 13.45l1.42-1.42M12.03 4.97l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          </svg>
        </button>

        <label class="sr-only" id="languageSelectLabel" for="languageSelect">Idioma</label>
        <select class="language-select" id="languageSelect" aria-label="Idioma">
          <option value="es">ES</option>
          <option value="en">EN</option>
        </select>

        <button class="btn btn--primary btn--topbar" id="newContactButton" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
          <span class="label-full" id="newContactLabelFull">Nuevo contacto</span>
          <span class="label-short" id="newContactLabelShort">Nuevo</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="page__intro" id="pageIntro" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Tus contactos</h1>
      <p id="pageSubtitle">Todo el mundo importante, en un solo lugar.</p>
      <p class="contact-count" id="contactCount" aria-live="polite"></p>
    </section>

    <section class="search-panel" id="searchPanel" aria-label="Buscar contactos">
      <div class="search-box">
        <svg class="search-box__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"></circle>
          <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="Buscar por nombre..." autocomplete="off">
        <button class="icon-button search-box__clear" id="clearSearchButton" type="button" aria-label="Limpiar busqueda" hidden>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
    </section>

    <section id="contentArea" class="content-area" aria-live="polite"></section>
  </main>

  <div id="drawerRoot"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
