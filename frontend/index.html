<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DirCon</title>
  <script>
    (function () {
      try {
        var accent = localStorage.getItem("dircon.accent");
        if (["blue", "purple", "orange"].includes(accent)) {
          document.documentElement.dataset.accent = accent;
        }

        if (localStorage.getItem("dircon.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#" aria-label="DirCon inicio">
        <span class="brand__mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="6.5" cy="5.5" r="2.5" fill="white"></circle>
            <path d="M1.5 14.5c0-2.761 2.239-5 5-5s5 2.239 5 5" stroke="white" stroke-width="1.5" stroke-linecap="round"></path>
            <circle cx="13" cy="7" r="2" fill="white" fill-opacity="0.7"></circle>
            <path d="M10.5 14.5c0-1.933 1.119-3.5 2.5-3.5s2.5 1.567 2.5 3.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"></path>
          </svg>
        </span>
        <span class="brand__name">Dir<span>Con</span></span>
      </a>

      <div class="topbar__actions">
        <details class="preferences-menu" id="preferencesMenu">
          <summary class="preferences-menu__trigger" id="preferencesTrigger" aria-label="Preferencias" title="Preferencias">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M9 11.8A2.8 2.8 0 109 6.2a2.8 2.8 0 000 5.6z" stroke="currentColor" stroke-width="1.5"></path>
              <path d="M14.85 9.9a5.93 5.93 0 00.03-1.8l1.28-1a.45.45 0 00.1-.58l-1.2-2.08a.45.45 0 00-.55-.2l-1.5.6a6.5 6.5 0 00-1.56-.9l-.22-1.6A.45.45 0 0010.8 2H7.2a.45.45 0 00-.44.38l-.22 1.6c-.56.22-1.08.52-1.56.9l-1.5-.6a.45.45 0 00-.55.2l-1.2 2.08a.45.45 0 00.1.58l1.28 1a5.93 5.93 0 000 1.8l-1.28 1a.45.45 0 00-.1.58l1.2 2.08a.45.45 0 00.55.2l1.5-.6c.48.38 1 .68 1.56.9l.22 1.6c.04.22.22.38.44.38h3.6c.22 0 .4-.16.44-.38l.22-1.6c.56-.22 1.08-.52 1.56-.9l1.5.6a.45.45 0 00.55-.2l1.2-2.08a.45.45 0 00-.1-.58l-1.31-1.04z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"></path>
            </svg>
          </summary>

          <div class="preferences-menu__panel" id="preferencesPanel" aria-labelledby="preferencesTitle">
            <div class="preferences-menu__header">
              <h2 id="preferencesTitle">Preferencias</h2>
            </div>

            <section class="preferences-section" aria-labelledby="appearancePreferencesTitle">
              <h3 id="appearancePreferencesTitle">Apariencia</h3>

              <div class="preference-row">
                <span class="preference-row__label" id="themePreferenceLabel">Tema</span>
                <div class="segmented-control" id="themeOptions" role="radiogroup" aria-labelledby="themePreferenceLabel"></div>
              </div>

              <div class="preference-row">
                <span class="preference-row__label" id="accentPreferenceLabel">Color de acento</span>
                <div class="accent-options" id="accentOptions" role="radiogroup" aria-labelledby="accentPreferenceLabel"></div>
              </div>
            </section>

            <section class="preferences-section" aria-labelledby="languagePreferencesTitle">
              <h3 id="languagePreferencesTitle">Idioma</h3>
              <div class="segmented-control" id="languageOptions" role="radiogroup" aria-labelledby="languagePreferencesTitle"></div>
            </section>
          </div>
        </details>

        <button class="btn btn--primary btn--topbar" id="newContactButton" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
          <span class="label-full" id="newContactLabelFull">Nuevo contacto</span>
          <span class="label-short" id="newContactLabelShort">Nuevo</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="page__intro" id="pageIntro" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Tus contactos</h1>
      <p id="pageSubtitle">Todo el mundo importante, en un solo lugar.</p>
      <p class="contact-count" id="contactCount" aria-live="polite"></p>
    </section>

    <section class="search-panel" id="searchPanel" aria-label="Buscar contactos">
      <div class="search-tools">
        <div class="search-box">
          <svg class="search-box__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"></circle>
            <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="Buscar por nombre..." autocomplete="off">
          <button class="icon-button search-box__clear" id="clearSearchButton" type="button" aria-label="Limpiar busqueda" hidden>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>

        <label class="sort-control" for="sortSelect">
          <span class="sort-control__label" id="sortLabel">Ordenar</span>
          <select id="sortSelect" aria-label="Ordenar contactos">
            <option value="newest">Más recientes</option>
            <option value="oldest">Más antiguos</option>
            <option value="nameAsc">A → Z</option>
            <option value="nameDesc">Z → A</option>
          </select>
        </label>
      </div>
    </section>

    <section id="contentArea" class="content-area" aria-live="polite"></section>
  </main>

  <div id="drawerRoot"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
